[project]
name = "newsletter-prototype"
version = "0.1.0"
description = "Local newsletter-to-knowledge-feed prototype"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "python-multipart", "httpx", "beautifulsoup4", "pypdf", "pillow", "pymupdf"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
